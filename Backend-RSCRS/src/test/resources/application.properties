# ===================================================================
# Test Configuration - In-Memory H2 Database
# ===================================================================
spring.datasource.url=jdbc:h2:mem:hirerankertest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

file.upload-dir=target/test-uploads

# ===================================================================
# JWT Security Properties for Testing
# ===================================================================
application.security.jwt.secret-key=${JWT_SECRET:local-test-only-jwt-key-not-a-secret-0123456789}
application.security.jwt.expiration=86400000

# ===================================================================
# AI Properties for Testing
# ===================================================================
application.ai.openrouter.api-key=test-openrouter-key
application.ai.openrouter.api-url=https://openrouter.ai/api/v1
application.ai.chatbot.model=qwen/qwen3-8b:free
application.ai.screening.model=qwen/qwen3-30b-a3b:free
application.ai.interview.model=openai/gpt-oss-20b
application.ai.groq.api-key=test-groq-key
application.ai.groq.api-url=https://api.groq.com/openai/v1/chat/completions
application.ai.interview.groq-fallback-model=openai/gpt-oss-20b

# Resend Test Configuration
resend.api.key=test-resend-key
resend.sender.email=test@hireranker.com
resend.sender.name=HireRanker Test
resend.timeout-seconds=5
app.frontend-url=http://localhost:4200


