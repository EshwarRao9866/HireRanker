# ===================================================================
# HireRanker - Backend Application Configuration
# ===================================================================

# Application & Server
spring.application.name=hireranker-backend
server.port=${SERVER_PORT:8080}

# ===================================================================
# MySQL Database Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/hireranker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# File Upload Configuration (Resume PDFs)
# ===================================================================
app.upload.dir=uploads/resumes
app.upload.max-file-size=10MB
file.upload-dir=uploads/resumes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# JWT Security Properties
# ===================================================================
application.security.jwt.secret-key=${JWT_SECRET:}
application.security.jwt.expiration=86400000

# ===================================================================
# HikariCP Connection Pool Configuration
# ===================================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=15000

# ===================================================================
# OpenRouter Unified AI Gateway Configuration
# ===================================================================
application.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
application.ai.openrouter.api-url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1}
application.ai.openrouter.timeout-seconds=${OPENROUTER_TIMEOUT_SECONDS:15}
application.ai.openrouter.site-url=https://hireranker.local
application.ai.openrouter.site-name=HireRanker
application.ai.openrouter.fallback-model=${AI_FALLBACK_MODEL:openrouter/free}

# Task-Specific AI Models (OpenRouter)
application.ai.chatbot.model=${CHATBOT_AI_MODEL:openai/gpt-oss-20b}
application.ai.screening.model=${SCREENING_AI_MODEL:nvidia/nemotron-3.5-lightning:free}
application.ai.interview.model=${INTERVIEW_AI_MODEL:openai/gpt-oss-20b}
application.ai.interview.evaluation-model=${INTERVIEW_EVAL_AI_MODEL:openai/gpt-oss-120b}

# ===================================================================
# Groq Fallback Configuration (Low-latency fallback for Live Interview & Screening)
# ===================================================================
application.ai.groq.api-key=${GROQ_API_KEY:}
application.ai.groq.api-url=https://api.groq.com/openai/v1/chat/completions
application.ai.groq.audio-transcription-url=https://api.groq.com/openai/v1/audio/transcriptions
application.ai.interview.groq-fallback-model=${INTERVIEW_GROQ_MODEL:openai/gpt-oss-20b}

# Dedicated Live Interview Speech-to-Text (STT) Configuration
application.ai.interview.stt.provider=${INTERVIEW_STT_PROVIDER:groq}
application.ai.interview.stt.model=${INTERVIEW_STT_MODEL:whisper-large-v3-turbo}
application.ai.interview.stt.fallback-model=whisper-large-v3

# ===================================================================
# Resume OCR Configuration (Automatic fallback for scanned/image PDFs)
# ===================================================================
app.ocr.enabled=${APP_OCR_ENABLED:true}
app.ocr.min-char-threshold=${APP_OCR_MIN_CHARS:50}
app.ocr.max-pages=${APP_OCR_MAX_PAGES:3}
application.ai.ocr.model=${OCR_AI_MODEL:inclusionai/ling-3.0-flash-vl:free}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.spring.eshwar.service.skill=DEBUG
logging.level.spring.eshwar.service.ai=INFO

# ===================================================================
# Resend Transactional Email Configuration
# ===================================================================
resend.api.key=${RESEND_API_KEY:}
resend.sender.email=${RESEND_SENDER_EMAIL:onboarding@resend.dev}
resend.sender.name=${RESEND_SENDER_NAME:HireRanker}
resend.timeout-seconds=10

# Frontend URL for Password Reset Links & Notifications
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
